{{- if .Values.secret.create }}
{{- if not .Values.secret.appId }}
{{- fail "secret.appId is required when secret.create is true" }}
{{- end }}
{{- if not .Values.secret.privateKey }}
{{- fail "secret.privateKey is required when secret.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-actions-exporter.secretName" . }}
  labels:
    {{- include "github-actions-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  github-app-id: {{ .Values.secret.appId | quote }}
  private-key.pem: |
{{ .Values.secret.privateKey | nindent 4 }}
{{- end }}
