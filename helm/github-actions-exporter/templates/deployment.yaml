apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-actions-exporter.fullname" . }}
  labels:
    {{- include "github-actions-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "github-actions-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "github-actions-exporter.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "github-actions-exporter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9101
              protocol: TCP
          env:
            - name: PORT
              value: "9101"
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.config.pollIntervalSeconds | quote }}
            - name: RUNS_PER_REPO
              value: {{ .Values.config.runsPerRepo | quote }}
            - name: ACTIVE_SINCE_DAYS
              value: {{ .Values.config.activeSinceDays | quote }}
            - name: COLLECT_RUNNER_STATUS
              value: {{ .Values.config.collectRunnerStatus | quote }}
            - name: METRIC_TTL_DAYS
              value: {{ .Values.config.metricTtlDays | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: GITHUB_API_URL
              value: {{ .Values.config.githubApiUrl | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /etc/github-app/private-key.pem
            {{- with .Values.config.githubAppInstallationId }}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ . | quote }}
            {{- end }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "github-actions-exporter.secretName" . }}
                  key: github-app-id
          volumeMounts:
            - name: github-app-key
              mountPath: /etc/github-app
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: github-app-key
          secret:
            secretName: {{ include "github-actions-exporter.secretName" . }}
            items:
              - key: private-key.pem
                path: private-key.pem
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
