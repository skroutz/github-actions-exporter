# DO NOT commit a real version of this file.
# Create the real secret with:
#   kubectl create secret generic github-actions-exporter \
#     --namespace github-actions-exporter \
#     --from-literal=github-app-id=123456 \
#     --from-file=private-key.pem=./your-app-private-key.pem
#
# Or, better on EKS: use External Secrets Operator + AWS Secrets Manager to
# sync this secret instead of creating it by hand — see README.md.
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-exporter
  namespace: github-actions-exporter
type: Opaque
stringData:
  github-app-id: "REPLACE_ME"
  # Leave unset to auto-discover & poll every installation of this App
  # (org-wide). Set it to pin the exporter to a single installation.
  # github-app-installation-id: "REPLACE_ME"
  private-key.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----
