name: Publish Helm chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/github-actions-exporter

jobs:
  publish:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint "$CHART_PATH"

      - name: Log in to GitHub Container Registry
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package "$CHART_PATH" --destination .helm-package

      - name: Push chart
        env:
          CHART_OWNER: ${{ github.repository_owner }}
        run: helm push .helm-package/*.tgz "oci://$REGISTRY/${CHART_OWNER,,}/charts"
